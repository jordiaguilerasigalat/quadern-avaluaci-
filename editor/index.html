<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor d'exàmens</title>
<link rel="stylesheet" href="css/editor.css" data-css-editor>
<link rel="stylesheet" href="css/fuentes.css" id="embeddedFontFaces">
<style id="pagecss">@page{size:210mm 297mm;margin:0}</style>
</head>
<body>
<div id="app" data-view="stage">
  <header class="topbar">
    <div class="brand"><i></i>Editor d'exàmens</div>
    <input id="examName" class="examname" type="text" aria-label="Nom de l'examen" placeholder="Nom de l'examen">
    <button class="btn" id="btnNew">Nou</button>
    <button class="btn" id="btnOpen">Obrir</button>
    <button class="btn" id="btnSave" title="Descarrega una còpia de l'examen per a guardar-la o passar-la a un altre ordinador">Guardar arxiu</button>
    <span class="group">
      <button class="btn icon" id="btnUndo" title="Desfer (Ctrl+Z)" aria-label="Desfer">↶</button>
      <button class="btn icon" id="btnRedo" title="Refer (Ctrl+Y)" aria-label="Refer">↷</button>
    </span>
    <button class="btn" id="btnAudit" title="Comprovar puntuacions, continguts i paginació abans d'exportar">Validar</button>
    <button class="btn" id="btnVersions" title="Consultar versions guardades i recuperar-ne una d'anterior">Versions</button>
    <button class="btn" id="btnBank" title="Guardar i inserir blocs reutilitzables">Banc de blocs</button>
    <span class="sp"></span>
    <span class="status" id="status"></span>
    <button class="btn themebtn" id="btnTheme" title="Canviar entre tema automàtic, clar i fosc">Tema</button>
    <button class="btn" id="btnDocx" title="Descarregar una versió editable en Word">Exportar Word</button>
    <button class="btn primary" id="btnPdf">Exportar PDF</button>
  </header>

  <nav class="mobile-tabs">
    <button data-view="outline">Estructura</button>
    <button data-view="stage" class="on">Vista</button>
    <button data-view="side">Ajustos</button>
  </nav>

  <aside id="outline" class="panel" aria-label="Estructura de l'examen">
    <div class="panel-head">
      <h2>Estructura</h2>
      <button class="btn sm primary" id="btnAdd">+ Afegir</button>
    </div>
    <div class="scroll"><div id="tree"></div></div>
    <div class="totals" id="totals"></div>
  </aside>

  <main id="stage">
    <div class="stagebar">
      <span class="group">
        <button class="btn sm icon" id="zOut" aria-label="Reduir">−</button>
        <button class="btn sm" id="zFit" title="Ajustar a l'amplària">Ajustar</button>
        <button class="btn sm icon" id="zIn" aria-label="Ampliar">+</button>
      </span>
      <span class="zoomval" id="zVal">100%</span>
      <label><input type="checkbox" id="chkGuides"> Vore els marges</label>
      <span class="sp"></span>
      <span class="status" id="pageCount"></span>
    </div>
    <div class="warnbar" id="warn" hidden></div>
    <div id="stageScroll" tabindex="0" aria-label="Pàgines de l'examen"><div id="pagesOuter"><div id="pages"></div></div></div>
  </main>

  <aside id="side" class="panel" aria-label="Ajustos">
    <div class="tabs" role="tablist">
      <button data-tab="block" class="on" role="tab" aria-selected="true" aria-controls="inspector">Bloc</button>
      <button data-tab="page" role="tab" aria-selected="false" aria-controls="inspector">Examen</button>
      <button data-tab="hf" role="tab" aria-selected="false" aria-controls="inspector">Capçalera i peu</button>
    </div>
    <div class="scroll"><div id="inspector" class="pad" role="tabpanel"></div></div>
  </aside>
</div>

<div id="measure" class="paper"></div>

<dialog id="dlg"></dialog>
<input type="file" id="fileOpen" accept=".json,application/json" hidden>
<input type="file" id="fileSnippetOpen" accept=".json,application/json" hidden>
<script src="js/01-nucleo.js"></script>
<script src="js/02-maquetacion.js"></script>
<script src="js/03-interfaz-arbol.js"></script>
<script src="js/04-inspector.js"></script>
<script src="js/05-dialogos.js"></script>
<script src="js/06-exportacion-docx.js"></script>
<script src="js/07-archivos-y-calidad.js"></script>
<script src="js/08-arranque.js"></script>
<script src="js/puente-cuaderno.js"></script>
</body>
</html>
